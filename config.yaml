# =============================================================================
# Phase 1 — Core AI Melanoma Diagnosis Engine
# Single Configuration File
# =============================================================================

project:
  name: melanoma_phase_final
  version: "2.0.0"
  seed: 42
  device: auto  # auto | cuda | cpu

# ---------------------------------------------------------------------------
# Preprocessing
# ---------------------------------------------------------------------------
preprocessing:
  hair_removal: true
  illumination_normalization: true
  preserve_scale_reference: true
  max_processing_dimension: 1600
  # Store the exact cleaned model input so reports can show the selected layer.
  save_preprocessed_preview: true

# Technical input gate only; these are conservative baselines and should be
# calibrated against representative validation images before production use.
quality:
  min_width: 256
  min_height: 256
  max_aspect_ratio: 4.0
  min_laplacian_variance: 0.0
  max_extreme_pixel_ratio: 0.98

# Optional planar reference metadata. Leave null when absent; no physical
# scale is invented when the image has no validated reference.
calibration:
  # Adjacent minor ticks on this image source are 1 mm apart. Auto calibration
  # measures their pixel spacing on the original image; no practitioner input
  # is needed. Set null for image sources whose physical tick interval is unknown.
  ruler_tick_interval_mm: 1.0
  # ChArUco takes priority when a board is configured. Fill in
  # the printed board dimensions in millimetres; leave null when absent.
  charuco_squares_x: null
  charuco_squares_y: null
  charuco_square_length_mm: null
  charuco_marker_length_mm: null
  charuco_dictionary_id: 0  # OpenCV DICT_4X4_50
  aruco_marker_size_mm: null
  aruco_marker_id: null
  checkerboard_inner_corners: []
  checkerboard_square_size_mm: null
  # Hand-drawn black line reference (a single straight stroke). Set the physical
  # length of the drawn line in millimetres; leave null to require it per request
  # via the scale_reference_mm field. Used by scale_method "line" and as the
  # final fallback in "auto" mode.
  line_length_mm: null

# ---------------------------------------------------------------------------
# Module 3 — Swin Transformer V2 Classification
# ---------------------------------------------------------------------------
classification:
  model_name: swinv2_base_window12to16_192to256
  num_classes: 2
  class_names:
    - melanoma
    - non_melanoma
  # NOTE: class_to_idx follows sorted alphabetical order from the Kaggle dataset:
  #   melanoma     -> index 0
  #   non_melanoma -> index 1
  # The production inference code reads class mapping from the checkpoint.
  melanoma_class_name: melanoma
  # Validation-optimized via Youden's J (sensitivity >= 0.9 floor) on the
  # Kaggle training notebook's validation set. The checkpoint also stores
  # this value, and the inference code now prefers the checkpoint's copy.
  classification_threshold: 0.3775
  img_size: 256
  batch_size: 16          # Kaggle T4: 16 | Local RTX 4050: 4
  num_workers: 4
  max_epochs: 50
  lr_head: 1.0e-4
  lr_backbone: 1.0e-5
  weight_decay: 1.0e-2
  early_stopping_patience: 7
  label_smoothing: 0.1

# ---------------------------------------------------------------------------
# Module 4 — SegFormer Segmentation
# ---------------------------------------------------------------------------
segmentation:
  checkpoint: checkpoints/best_segformer_melanoma.pth
  encoder_name: mit_b2
  input_size: 256
  morphological_closing_kernel: 5

# ---------------------------------------------------------------------------
# Module 5 — ABC Feature Extraction
# ---------------------------------------------------------------------------
features:
  asymmetry:
    low_threshold: 0.15
    high_threshold: 0.35
  border:
    smooth_threshold: 0.85
    irregular_threshold: 0.65
  color:
    min_cluster_ratio: 0.05
    max_clusters: 6

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  dataset_root: dataset/
  classification_train: dataset/classification/train/
  classification_val: dataset/classification/val/
  classification_test: dataset/classification/test/
  segmentation_images: dataset/segmentation/images/
  segmentation_masks: dataset/segmentation/masks/
  checkpoints: checkpoints/
  # New model trained with Codex — used for all live inference and Grad-CAM.
  classification_checkpoint: checkpoints/best_swin_checkpoint.pth
  outputs: outputs/

# ---------------------------------------------------------------------------
# Evidence Agent — canonical advanced hybrid retrieval backend
# ---------------------------------------------------------------------------
evidence:
  max_retrieval_cycles: 1
  backend: rag_pipeline.agent.AdvancedRetrievalBackend

# ---------------------------------------------------------------------------
# Vision tools / evidence-grounded synthesis
# ---------------------------------------------------------------------------
explainability:
  mode: llm                    # template | llm
  llm_provider: gemini          # gemini (requires GEMINI_API_KEY env var)
  model: gemini-3.8-flash
  fallback_model: gemini-3.1-flash-lite
  # Interactive requests try the primary model once, then the fallback once.
  request_timeout_seconds: 30.0
  max_retries: 2
  retry_delay: 1.0
  fallback_after_retries: 1
  gradcam_ail_threshold: 0.30
  compute_gradcam: true

# ---------------------------------------------------------------------------
# Report Agent rendering tool
# ---------------------------------------------------------------------------
report:
  output_dir: outputs/reports/
  save_pdf: true
  include_gradcam: true
  include_evidence: true

# ---------------------------------------------------------------------------
# Orchestrator Agent — Agentic Decision Thresholds
# ---------------------------------------------------------------------------
orchestrator:
  # The Gemini planner receives the current CaseState and a constrained list
  # of safe function tools on every orchestration step. It falls back to the
  # local policy when no Gemini key/service is available.
  cognitive_reasoning: true
  request_timeout_seconds: 15.0
  classification_confidence_threshold: 70.0
  segmentation_min_area_px: 100
  segmentation_max_area_ratio: 1.0
  gradcam_reliability_threshold: 0.30
  max_retry_attempts: 1
  max_supervisor_steps: 12
  # ABCDE fusion weights (must sum to 1.0). Remove to use defaults.
  abcde_weights:
    classifier: 0.60   # Swin classifier -- primary signal
    E: 0.15            # Evolution -- most important clinical feature
    A: 0.08            # Asymmetry
    B: 0.07            # Border irregularity
    C: 0.06            # Color diversity
    D: 0.04            # Diameter (lowest; often uncalibrated)
